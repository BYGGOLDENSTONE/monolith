name: Proxy transport contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse plugin descriptor
        run: python -c "import json; json.load(open('Monolith.uplugin'))"
      - name: Check templates, versions, skills, and repository hygiene
        run: python Scripts/check_repo_lint.py

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exercise Python proxy over stdio and HTTP
        run: python -m unittest discover -s Scripts/tests -v

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure native proxy
        run: cmake -S Tools/MonolithProxy -B build/proxy -A x64
      - name: Build native proxy
        run: cmake --build build/proxy --config Release --parallel
      - name: Exercise both proxy implementations with identical contracts
        shell: pwsh
        run: |
          $env:MONOLITH_TEST_NATIVE_PROXY = (Resolve-Path build/proxy/Release/monolith_proxy.exe).Path
          python -m unittest discover -s Scripts/tests -v
